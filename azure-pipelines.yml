  # ── 3. Deploy ─────────────────────────────────────────────────────────────
  - job: Deploy
    # dependsOn: Build

    variables:                          # ✅ All variables merged into ONE block
      - name: ENV
        ${{ if or(eq(variables['Build.SourceBranchName'], 'main'), eq(variables['Build.SourceBranchName'], 'master')) }}:
          value: 'prod'
        ${{ elseif eq(variables['Build.SourceBranchName'], 'uat') }}:
          value: 'uat'
        ${{ else }}:
          value: 'dev'
      - name: imageTag
        ${{ if or(eq(variables['Build.SourceBranchName'], 'main'), eq(variables['Build.SourceBranchName'], 'master')) }}:
          value: 'prod'
        ${{ elseif eq(variables['Build.SourceBranchName'], 'uat') }}:
          value: 'uat'
        ${{ else }}:
          value: 'dev'
      - name: DOCKER_REPO
        value: 'nhkyaw/visit-record-app'

    steps:                            
    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
        backendServiceArm: 'nhk_terraform_iam'
        backendAzureRmResourceGroupName: 'th-lab_group'
        backendAzureRmStorageAccountName: 'nhkstgacc'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'env/$(ENV)/terraform.tfstate'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Apply'
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
        environmentServiceNameAzureRM: 'nhk_terraform_iam'
        commandOptions: '-auto-approve -var-file="$(ENV).tfvars"'

    - script: |
        VM_IP=$(terraform output -raw vm_public_ip)
        echo "##vso[task.setvariable variable=VM_IP]$VM_IP"
      displayName: 'Get VM Public IP'
      workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'

    - task: DownloadSecureFile@1
      displayName: 'Download SSH Key'
      name: sshKey
      inputs:
        secureFile: 'nhkyaw-ssh-key.pem'              # upload your .pem file to Library → Secure Files

    - script: |
        chmod 600 $(sshKey.secureFilePath)
      displayName: 'Set SSH Key Permission'

    - script: |
        ssh -o StrictHostKeyChecking=no \
            -i $(sshKey.secureFilePath) \
            nhkyaw@$(VM_IP) "echo connected"
      displayName: 'Test SSH Connection'

    - script: |
        scp -o StrictHostKeyChecking=no \
            -i $(sshKey.secureFilePath) \
            -r docker nhkyaw@$(VM_IP):~/
      displayName: 'Copy Docker Directory to VM'
      workingDirectory: '$(System.DefaultWorkingDirectory)'

    - script: |                        
        ssh -o StrictHostKeyChecking=no \
            -i $(sshKey.secureFilePath) \
            nhkyaw@$(VM_IP) "
              set -e
              export IMAGE_TAG=$(imageTag)
              export DOCKER_REPO=$(DOCKER_REPO)
              sudo chmod +x /home/nhkyaw/docker/deploy.sh
              /home/nhkyaw/docker/deploy.sh
            "
      displayName: 'Deploy to Azure VM'