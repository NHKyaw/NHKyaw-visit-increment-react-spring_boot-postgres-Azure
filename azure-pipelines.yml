trigger:
  - main
  - master
  - uat       
  - dev

pool:
  name: 'Self-Hosted'
  demands:
    - agent.name -equals nhk-VMware-Virtual-Platform

jobs:
  - job: Test

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: my_database
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 12345678
        ports:
          - 5432:5432
        endpoint: 'Docker_Login'

    steps:
      # Install Node.js
      - task: UseNode@1
        inputs:
          version: "20.19.6"
        displayName: 'Install Node.js'

      - task: Cache@2
        inputs:
          key: 'npm | "$(Agent.OS)" | frontend/package-lock.json'
          restoreKeys: |
            npm | "$(Agent.OS)"
          path: $(System.DefaultWorkingDirectory)/frontend/node_modules
        displayName: 'Cache npm dependencies'

      - script: |
          npm install
          ls -al node_modules
        workingDirectory: $(System.DefaultWorkingDirectory)/frontend/
        displayName: 'Install Frontend dependencies'

      - script: |
          npm test -- --watchAll=false
        workingDirectory: $(System.DefaultWorkingDirectory)/frontend/
        displayName: 'Run Frontend Tests'

      # # Install Java
      # - task: JavaToolInstaller@0
      #   inputs:
      #     versionSpec: '21'
      #     jdkArchitectureOption: 'x64'
      #     jdkSourceOption: 'AzureJDK'
      #   displayName: 'Install Java 21'

      - script: |
          until pg_isready -h localhost -p 5432; do
            echo "Waiting for postgres..."
            sleep 2
          done
          echo "Postgres is ready!"
        displayName: 'Wait for Postgres'

      - task: Cache@2
        inputs:
          key: 'maven | "$(Agent.OS)" | backend/pom.xml'
          restoreKeys: |
            maven | "$(Agent.OS)"
          path: $(HOME)/.m2/repository
        displayName: 'Cache Maven dependencies'

      - script: |
          ./mvnw test
        workingDirectory: $(System.DefaultWorkingDirectory)/backend/
        displayName: 'Run Backend Tests'  


  - job: Build
    dependsOn: Test

    ###'Set Image Tag'
    variables:
      - name: imageTag
        ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
          value: 'prod'
        ${{ elseif eq(variables['Build.SourceBranchName'], 'master') }}:
          value: 'prod'
        ${{ elseif eq(variables['Build.SourceBranchName'], 'uat') }}:
          value: 'uat'
        ${{ else }}:
          value: 'dev'

    steps:
    - task: Docker@2
      displayName: Login to Docker Hub
      inputs:
        command: login
        containerRegistry: Docker_Login

    - task: Docker@2
      displayName: 'Build Frontend Image'
      inputs:
        command: build
        containerRegistry: Docker_Login
        repository: nhkyaw/visit-record-app
        dockerfile: frontend/Dockerfile
        buildContext: frontend/
        tags: frontend-$(imageTag)

    - task: Docker@2
      displayName: 'Push Frontend Image'
      inputs:
        command: push
        containerRegistry: Docker_Login
        repository: nhkyaw/visit-record-app
        tags: frontend-$(imageTag)

    - task: Docker@2
      displayName: 'Build Backend Image'
      inputs:
        command: build
        containerRegistry: Docker_Login
        repository: nhkyaw/visit-record-app
        dockerfile: backend/Dockerfile
        buildContext: backend/
        tags: backend-$(imageTag)

    - task: Docker@2
      displayName: 'Push Backend Image'
      inputs:
        command: push
        containerRegistry: Docker_Login
        repository: nhkyaw/visit-record-app
        tags: backend-$(imageTag)

  - job: Deploy
    dependsOn: Build

    ###'Set ENV Tag'
    variables:
      - name: ENV
        ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
          value: 'prod'
        ${{ elseif eq(variables['Build.SourceBranchName'], 'master') }}:
          value: 'prod'
        ${{ elseif eq(variables['Build.SourceBranchName'], 'uat') }}:
          value: 'uat'
        ${{ else }}:
          value: 'dev'
      - task: TerraformInstaller@1
        displayName: 'Install Terraform'
        inputs:
          terraformVersion: 'latest'

      - task: TerraformTaskV4@4
        displayName: 'Terraform Init'
        inputs:
          provider: 'azurerm'
          command: 'init'
          workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
          backendServiceArm: 'nhk_terraform_iam'
          backendAzureRmResourceGroupName: 'th-lab_group'
          backendAzureRmStorageAccountName: 'nhkstgacc'
          backendAzureRmContainerName: 'tfstate'
          backendAzureRmKey: 'env/$(ENV)/terraform.tfstate'

      # Alternative way to run Terraform Init using script task
      # - script: |
      #     terraform init \
      #       -backend-config="key=env/$(ENV)/terraform.tfstate"
      #   displayName: 'Terraform Init'
      #   workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'

      - task: TerraformTaskV4@4
        displayName: 'Terraform Apply'
        inputs:
          provider: 'azurerm'
          command: 'apply'
          workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
          environmentServiceNameAzureRM: 'nhk_terraform_iam'
          commandOptions: '-auto-approve -var-file="$(ENV).tfvars"'
