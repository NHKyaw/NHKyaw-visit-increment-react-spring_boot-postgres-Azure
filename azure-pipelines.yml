trigger:
  - main
  - master
  - uat       
  - dev

pool:
  name: 'Self-Hosted'
  demands:
    - agent.name -equals nhk-VMware-Virtual-Platform

jobs:
  # ── 1. Test ───────────────────────────────────────────────────────────────
  - job: Test

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: my_database
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 12345678
        ports:
          - 5432:5432
        endpoint: 'Docker_Login'

    steps:
      - task: UseNode@1
        inputs:
          version: "20.19.6"
        displayName: 'Install Node.js'

      - task: Cache@2
        inputs:
          key: 'npm | "$(Agent.OS)" | frontend/package-lock.json'
          restoreKeys: |
            npm | "$(Agent.OS)"
          path: $(System.DefaultWorkingDirectory)/frontend/node_modules
        displayName: 'Cache npm dependencies'

      - script: |
          npm install
          ls -al node_modules
        workingDirectory: $(System.DefaultWorkingDirectory)/frontend/
        displayName: 'Install Frontend dependencies'

      - script: |
          npm test -- --watchAll=false
        workingDirectory: $(System.DefaultWorkingDirectory)/frontend/
        displayName: 'Run Frontend Tests'

      - script: |
          until pg_isready -h localhost -p 5432; do
            echo "Waiting for postgres..."
            sleep 2
          done
          echo "Postgres is ready!"
        displayName: 'Wait for Postgres'

      - task: Cache@2
        inputs:
          key: 'maven | "$(Agent.OS)" | backend/pom.xml'
          restoreKeys: |
            maven | "$(Agent.OS)"
          path: $(HOME)/.m2/repository
        displayName: 'Cache Maven dependencies'

      - script: |
          ./mvnw test
        workingDirectory: $(System.DefaultWorkingDirectory)/backend/
        displayName: 'Run Backend Tests'


  # ── 2. Build ──────────────────────────────────────────────────────────────
  - job: Build
    dependsOn: Test

    variables:
      - name: imageTag
        ${{ if or(eq(variables['Build.SourceBranchName'], 'main'), eq(variables['Build.SourceBranchName'], 'master')) }}:
          value: 'prod'
        ${{ elseif eq(variables['Build.SourceBranchName'], 'uat') }}:
          value: 'uat'
        ${{ else }}:
          value: 'dev'

    steps:
    - task: Docker@2
      displayName: 'Login to Docker Hub'
      inputs:
        command: login
        containerRegistry: Docker_Login

    - task: Docker@2
      displayName: 'Build Frontend Image'
      inputs:
        command: build
        containerRegistry: Docker_Login
        repository: nhkyaw/visit-record-app
        dockerfile: frontend/Dockerfile
        buildContext: frontend/
        tags: frontend-$(imageTag)

    - task: Docker@2
      displayName: 'Push Frontend Image'
      inputs:
        command: push
        containerRegistry: Docker_Login
        repository: nhkyaw/visit-record-app
        tags: frontend-$(imageTag)

    - task: Docker@2
      displayName: 'Build Backend Image'
      inputs:
        command: build
        containerRegistry: Docker_Login
        repository: nhkyaw/visit-record-app
        dockerfile: backend/Dockerfile
        buildContext: backend/
        tags: backend-$(imageTag)

    - task: Docker@2
      displayName: 'Push Backend Image'
      inputs:
        command: push
        containerRegistry: Docker_Login
        repository: nhkyaw/visit-record-app
        tags: backend-$(imageTag)


  # ── 3. Deploy ─────────────────────────────────────────
  - job: Deploy
    dependsOn: Build

    variables:                                        
      - name: ENV
        ${{ if or(eq(variables['Build.SourceBranchName'], 'main'), eq(variables['Build.SourceBranchName'], 'master')) }}:
          value: 'prod'
        ${{ elseif eq(variables['Build.SourceBranchName'], 'uat') }}:
          value: 'uat'
        ${{ else }}:
          value: 'dev'

    variables:
      - name: imageTag
        ${{ if or(eq(variables['Build.SourceBranchName'], 'main'), eq(variables['Build.SourceBranchName'], 'master')) }}:
          value: 'prod'
        ${{ elseif eq(variables['Build.SourceBranchName'], 'uat') }}:
          value: 'uat'
        ${{ else }}:
          value: 'dev'

    variables:
      DOCKER_REPO: 'nhkyaw/visit-record-app'

    steps:                                           
    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
        backendServiceArm: 'nhk_terraform_iam'
        backendAzureRmResourceGroupName: 'th-lab_group'
        backendAzureRmStorageAccountName: 'nhkstgacc'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'env/$(ENV)/terraform.tfstate'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Apply'
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
        environmentServiceNameAzureRM: 'nhk_terraform_iam'
        commandOptions: '-auto-approve -var-file="$(ENV).tfvars"'

    # ── Get VM IP from Terraform Output
    - script: |
        VM_IP=$(terraform output -raw vm_public_ip)
        echo "##vso[task.setvariable variable=VM_IP]$VM_IP"
      displayName: 'Get VM Public IP'
      workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'

    - script: |
        mkdir -p ~/.ssh
        echo "$(nhkyaw-ssh-key)" > ~/.ssh/vm.pem
        chmod 600 ~/.ssh/vm.pem
      displayName: 'Prepare SSH Key'

    # ── Copy Docker Directory to VM ───────────────────────────────────────────
    - script: |
        scp -o StrictHostKeyChecking=no \
            -i ~/.ssh/vm.pem \
            -r docker ubuntu@$(VM_IP):~/
      displayName: 'Copy Docker Directory to VM'
      workingDirectory: '$(System.DefaultWorkingDirectory)'


  # ── Deploy ────────────────────────────────────────────────────────────────
  - script: |
      ssh -o StrictHostKeyChecking=no \
          -i ~/.ssh/vm.pem \
          ubuntu@$(VM_IP) "
            set -e
            export IMAGE_TAG=$(imageTag)
            export DOCKER_REPO=$(DOCKER_REPO)
            sudo chmod +x /home/ubuntu/docker/deploy.sh
            /home/ubuntu/docker/deploy.sh
          "
    displayName: 'Deploy to Azure VM'